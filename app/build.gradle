plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.sy.ecp'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.sy.ecp"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [AROUTER_MODULE_NAME: project.getName()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    dataBinding {
        enable true
    }
}

dependencies {

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    annotationProcessor libs.arouterCompiler

    if (rootProject.ext.isModule) {
        implementation project(":library_base")

    } else {
        implementation project(":library_base")
        implementation project(":feature_categorize")
        implementation project(":feature_home")
        implementation project(":feature_shoppingcart")
        implementation project(":feature_user")
    }
}